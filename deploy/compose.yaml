# Four banks on one machine: the quickstart network. Each bank is an engine (cmd/server), a signer
# (cmd/signer) and a fetcher (cmd/fetcher), from the go-ledger image (deploy/Dockerfile), and a wallet,
# from the go-ledger-ui image (deploy/ui.Dockerfile). make quickstart writes deploy/quickstart/ with
# cmd/quickstart (the keys, the genesis, the configs, the secrets and network.env), builds the images,
# then starts this file:
#
#   docker compose -f deploy/compose.yaml --env-file deploy/quickstart/network.env up -d
#
# - The engines gossip on the gossip port, 8070, at the fixed IP addresses below, which the genesis
#   lists. Each engine's allow list lets in only those addresses. The port is not published.
# - The fetchers and the wallets have fixed IP addresses on that network, ledger, too, so that no
#   container of this file takes an address from its pool: one that took a stopped engine's would be
#   let in by the others.
# - Each engine's operator port, 8080, serves every route, for its fetcher and its bank's wallet. It is
#   not published either. On a real network it sits on the bank's own network; here every container
#   shares one.
# - Each fetcher is its bank's public face and its public address on chain, such as
#   http://bank-a-fetcher:8080. It is published on this machine only, at 127.0.0.1:18081 to 18084, for
#   a wallet.
# - Each engine keeps its data in a volume, which its fetcher mounts read-only. Both run as the image's
#   user, 65532, since the engine keeps its record files readable by that user only.
# - Each bank's key is in its signer only, sealed, with the passphrase that opens it (spec §2.8). The
#   signer sits on the bank's signing network, such as signing-bank-a: internal, so nothing on it reaches
#   out, and joined by no container but the signer and its two clients, the bank's engine and wallet. Its
#   port is not published, and its allowFrom lets in that network's subnet only (spec §2.2). The engine's
#   config and its client secret, and the wallet's client secret, are mounted read-only as secrets. Each
#   signer keeps its logs in deploy/quickstart, beside its files.
# - The engine and the wallet take an address from their signing network's pool: Podman 3.4 keeps one
#   fixed address per container, on its first network by name, and theirs must be on ledger. So each
#   signing network's name sorts after ledger's.
# - Each bank's wallet, its desk and its admin page in one, signs through its signer, and holds only the
#   bank's public key. It is published on this machine only, at 127.0.0.1:18091 to 18094, under the port
#   it listens on: the wallet refuses a request for another port. In its container it listens beyond
#   loopback, where any container on ledger reaches it, so it asks for a password, under any user name:
#   the one in deploy/quickstart, such as bank-a.wallet.password, mounted as a secret.
# - GENESIS_HASH_PREFIX, from network.env, is the first 16 hex digits of the genesis hash. The engine
#   names its record files with it, so that each network's are apart.

services:
  bank-a-engine:
    image: go-ledger
    command: ["/server", "-config", "/run/secrets/bank-a-config"]
    secrets: [bank-a-config, bank-a-engine-secret]
    volumes: ["./quickstart/genesis.json:/genesis.json:ro", "bank-a-data:/data"]
    networks:
      ledger:
        ipv4_address: 172.28.70.11
      signing-bank-a:
    depends_on: [bank-a-signer]
    restart: on-failure # its key self-test fails until its signer answers, and stops it
  bank-a-signer:
    image: go-ledger
    # The signer runs in /quickstart, where its files have the names they have in deploy/quickstart, the
    # names its config gives them. Only this bank's are mounted: its key, its passphrase and its clients'
    # secrets, read-only, and the folder of its logs.
    command: ["/signer", "-config", "bank-a.signer.json"]
    working_dir: /quickstart
    volumes: ["./quickstart/genesis.json:/quickstart/genesis.json:ro", "./quickstart/bank-a.signer.json:/quickstart/bank-a.signer.json:ro",
      "./quickstart/bank-a.key.json:/quickstart/bank-a.key.json:ro", "./quickstart/bank-a.passphrase:/quickstart/bank-a.passphrase:ro",
      "./quickstart/bank-a.engine.secret:/quickstart/bank-a.engine.secret:ro", "./quickstart/bank-a.wallet.secret:/quickstart/bank-a.wallet.secret:ro",
      "./quickstart/bank-a.signer-logs:/quickstart/bank-a.signer-logs"]
    networks:
      signing-bank-a:
        ipv4_address: 172.28.71.254
  bank-a-fetcher:
    image: go-ledger
    command: ["/fetcher", "-engine", "http://bank-a-engine:8080", "-folder", "/data/public",
      "-record", "/data/snapshot.json.${GENESIS_HASH_PREFIX:?pass --env-file deploy/quickstart/network.env}.record",
      "-lifelong", "/data/snapshot.json.${GENESIS_HASH_PREFIX:?pass --env-file deploy/quickstart/network.env}.lifelong.jsonl"]
    volumes: ["bank-a-data:/data:ro"]
    ports: ["127.0.0.1:18081:8080"]
    networks:
      ledger:
        ipv4_address: 172.28.70.21
    depends_on: [bank-a-engine] # the engine mounts the volume first, writable, so it gets /data's owner
  bank-a-wallet:
    image: go-ledger-ui
    command: ["-node", "http://bank-a-engine:8080", "-network", "quickstart", "-listen", ":18091",
      "-password-file", "/run/secrets/bank-a-wallet-password",
      "-signer-url", "http://172.28.71.254:7000", "-signer-client", "wallet", "-signer-secret-file", "/run/secrets/bank-a-wallet-secret"]
    secrets: [bank-a-wallet-secret, bank-a-wallet-password]
    volumes: ["bank-a-wallet:/wallet", "./quickstart/bank-a.wallet.json:/wallet/wallet.json:ro"]
    ports: ["127.0.0.1:18091:18091"]
    networks:
      ledger:
        ipv4_address: 172.28.70.31
      signing-bank-a:
    depends_on: [bank-a-engine]

  bank-b-engine:
    image: go-ledger
    command: ["/server", "-config", "/run/secrets/bank-b-config"]
    secrets: [bank-b-config, bank-b-engine-secret]
    volumes: ["./quickstart/genesis.json:/genesis.json:ro", "bank-b-data:/data"]
