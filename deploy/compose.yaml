    file: ./quickstart/bank-b.wallet.password
  bank-c-config:
    file: ./quickstart/bank-c.json
  bank-c-engine-secret:
    file: ./quickstart/bank-c.engine.secret
  bank-c-wallet-secret:
    file: ./quickstart/bank-c.wallet.secret
  bank-c-wallet-password:
    file: ./quickstart/bank-c.wallet.password
  bank-d-config:
    file: ./quickstart/bank-d.json
  bank-d-engine-secret:
