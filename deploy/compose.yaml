      signing-bank-c:
    depends_on: [bank-c-signer]
    restart: on-failure
  bank-c-signer:
    image: go-ledger
    command: ["/signer", "-config", "bank-c.signer.json"]
    working_dir: /quickstart
    volumes: ["./quickstart/genesis.json:/quickstart/genesis.json:ro", "./quickstart/bank-c.signer.json:/quickstart/bank-c.signer.json:ro",
      "./quickstart/bank-c.key.json:/quickstart/bank-c.key.json:ro", "./quickstart/bank-c.passphrase:/quickstart/bank-c.passphrase:ro",
      "./quickstart/bank-c.engine.secret:/quickstart/bank-c.engine.secret:ro", "./quickstart/bank-c.wallet.secret:/quickstart/bank-c.wallet.secret:ro",
      "./quickstart/bank-c.signer-logs:/quickstart/bank-c.signer-logs"]
    networks:
      signing-bank-c:
        ipv4_address: 172.28.73.254
  bank-c-fetcher:
    image: go-ledger
    command: ["/fetcher", "-engine", "http://bank-c-engine:8080", "-folder", "/data/public",
