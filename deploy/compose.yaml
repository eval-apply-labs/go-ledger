      signing-bank-b:
    depends_on: [bank-b-signer]
    restart: on-failure
  bank-b-signer:
    image: go-ledger
    command: ["/signer", "-config", "bank-b.signer.json"]
    working_dir: /quickstart
    volumes: ["./quickstart/genesis.json:/quickstart/genesis.json:ro", "./quickstart/bank-b.signer.json:/quickstart/bank-b.signer.json:ro",
      "./quickstart/bank-b.key.json:/quickstart/bank-b.key.json:ro", "./quickstart/bank-b.passphrase:/quickstart/bank-b.passphrase:ro",
      "./quickstart/bank-b.engine.secret:/quickstart/bank-b.engine.secret:ro", "./quickstart/bank-b.wallet.secret:/quickstart/bank-b.wallet.secret:ro",
      "./quickstart/bank-b.signer-logs:/quickstart/bank-b.signer-logs"]
    networks:
      signing-bank-b:
        ipv4_address: 172.28.72.254
  bank-b-fetcher:
    image: go-ledger
    command: ["/fetcher", "-engine", "http://bank-b-engine:8080", "-folder", "/data/public",
      "-record", "/data/snapshot.json.${GENESIS_HASH_PREFIX:?pass --env-file deploy/quickstart/network.env}.record",
      "-lifelong", "/data/snapshot.json.${GENESIS_HASH_PREFIX:?pass --env-file deploy/quickstart/network.env}.lifelong.jsonl"]
    volumes: ["bank-b-data:/data:ro"]
    ports: ["127.0.0.1:18082:8080"]
    networks:
      ledger:
        ipv4_address: 172.28.70.22
    depends_on: [bank-b-engine]
  bank-b-wallet:
    image: go-ledger-ui
    command: ["-node", "http://bank-b-engine:8080", "-network", "quickstart", "-listen", ":18092",
      "-password-file", "/run/secrets/bank-b-wallet-password",
      "-signer-url", "http://172.28.72.254:7000", "-signer-client", "wallet", "-signer-secret-file", "/run/secrets/bank-b-wallet-secret"]
    secrets: [bank-b-wallet-secret, bank-b-wallet-password]
    volumes: ["bank-b-wallet:/wallet", "./quickstart/bank-b.wallet.json:/wallet/wallet.json:ro"]
    ports: ["127.0.0.1:18092:18092"]
    networks:
      ledger:
        ipv4_address: 172.28.70.32
      signing-bank-b:
    depends_on: [bank-b-engine]

  bank-c-engine:
    image: go-ledger
