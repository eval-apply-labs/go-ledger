networks:
  ledger:
    ipam:
      config:
        - subnet: 172.28.70.0/24
  signing-bank-a:
    internal: true
    ipam:
      config:
        - subnet: 172.28.71.0/24
  signing-bank-b:
    internal: true
    ipam:
      config:
        - subnet: 172.28.72.0/24
  signing-bank-c:
    internal: true
    ipam:
      config:
        - subnet: 172.28.73.0/24
  signing-bank-d:
    internal: true
    ipam:
      config:
        - subnet: 172.28.74.0/24

volumes:
  bank-a-data:
  bank-b-data:
  bank-c-data:
  bank-d-data:
  bank-a-wallet:
  bank-b-wallet:
  bank-c-wallet:
  bank-d-wallet:

secrets:
  bank-a-config:
    file: ./quickstart/bank-a.json
  bank-a-engine-secret:
    file: ./quickstart/bank-a.engine.secret
  bank-a-wallet-secret:
    file: ./quickstart/bank-a.wallet.secret
  bank-a-wallet-password:
    file: ./quickstart/bank-a.wallet.password
  bank-b-config:
